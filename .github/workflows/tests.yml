name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v4

      - name: Checkout frappe_docker (SUT)
        run: git clone --depth 1 https://github.com/frappe/frappe_docker /tmp/frappe_docker

      - name: Start ERPNext via docker compose
        run: docker compose -f /tmp/frappe_docker/pwd.yml up -d

      - name: Wait for ERPNext to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/method/ping | grep -q pong; then
              echo "ERPNext is up"
              exit 0
            fi
            echo "Waiting for ERPNext... ($i/60)"
            sleep 10
          done
          echo "ERPNext did not become ready in time"
          docker compose -f /tmp/frappe_docker/pwd.yml logs --tail=200
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env
        run: |
          echo "BASE_URL=http://localhost:8080" >> .env
          echo "ADMIN_USER=Administrator" >> .env
          echo "ADMIN_PASSWORD=admin" >> .env

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Tear down ERPNext
        if: always()
        run: docker compose -f /tmp/frappe_docker/pwd.yml down -v
